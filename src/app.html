<title>Games Ground Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#111017;--surface:#1c1a25;--surface-2:#2a2734;--fg:#efedf5;--muted:#a6a2b8;--line:#36324a;
  --accent:#ff5cb0;--accent-fg:#1a0b13;--accent-soft:#3d1830;--gold:#ffc533;--gold-soft:#3a2e0c;
  --now:#45d3d6;--ok:#74dc93;--ok-soft:#14321f;--warn:#ff8a70;--warn-soft:#3e1b14;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
:root[data-gg-theme="light"]{
  color-scheme:light;
  --bg:#f4f3f8;--surface:#fff;--surface-2:#e7e5ee;--fg:#17151f;--muted:#5f5b6f;--line:#d8d5e2;
  --accent:#b8156f;--accent-fg:#fff;--accent-soft:#f8dcec;--gold:#a87300;--gold-soft:#fbedc6;
  --now:#0d8589;--ok:#17743a;--ok-soft:#d9f2e1;--warn:#b5381c;--warn-soft:#fbe1da;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--f-body);
  padding-left:var(--gl);padding-right:var(--gr);padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15}
a{color:var(--now)}
:focus-visible{outline:2px solid var(--now);outline-offset:2px}

/* ---------- top bar: on every screen ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  margin-left:calc(var(--gl) * -1);margin-right:calc(var(--gr) * -1);
  padding:8px var(--gr) 2px var(--gl);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.clock{font:700 13px var(--f-mono);color:var(--now);margin-left:auto;white-space:nowrap}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;min-height:36px;min-width:36px}
.ghost.icon{padding:0;width:36px;display:grid;place-items:center}
.ghost.icon svg{width:16px;height:16px;display:block}
.blocks{display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:8px 0 6px;margin-right:calc(var(--gr) * -1);padding-right:var(--gr)}
.blocks::-webkit-scrollbar{display:none}
.blocks::before,.blocks::after{content:"";flex:0 0 40vw}
.blk{flex:none;display:grid;gap:1px;text-align:left;position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px 5px;min-height:44px;max-width:124px;overflow:hidden}
.blk .bt{font:700 11.5px var(--f-mono)}
.blk .bl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .gm{position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold)}
.blk.cancel .bl{text-decoration:line-through}
.blk.past{opacity:.55}
.blk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);opacity:1}
.blk[aria-pressed="true"] .bl{color:var(--accent-fg)}
.dayline{position:relative;height:40px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.dayline::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.dl-in{position:absolute;inset:0 6px}
.dl-in>span{position:absolute;top:50%;pointer-events:none}
.dl-done{left:0;height:3px;margin-top:-1px;border-radius:2px;background:var(--now);opacity:.85}
.dl-n{width:3px;height:11px;margin:-5px 0 0 -1.5px;border-radius:1px;background:var(--muted)}
.dl-n.pk{width:4px;height:15px;margin:-7px 0 0 -2px;background:var(--gold);box-shadow:0 0 0 1.5px var(--bg)}
.dl-n.on{width:7px;height:21px;margin:-10px 0 0 -3.5px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 1.5px var(--bg);z-index:2}
.dl-now{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--now);box-shadow:0 0 5px 1px var(--now);z-index:3}
.hours{position:relative;height:14px;margin:0 6px 4px;font:500 10px var(--f-mono);color:var(--muted)}
.hours span{position:absolute;transform:translateX(-50%);top:0}
.hours span:first-child{transform:none}

.banner{margin:10px 0 0;padding:9px 12px;border-radius:var(--r);background:var(--gold-soft);color:var(--fg);font-size:14px;border:1px solid var(--gold)}
main{padding-top:14px;max-width:680px;margin-inline:auto}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:4px var(--gr) calc(4px + env(safe-area-inset-bottom,0px)) var(--gl)}
.tabs button{border:0;background:transparent;font-weight:700;font-size:14px;color:var(--muted);padding:12px 0;border-radius:8px;min-height:48px}
.tabs button[aria-pressed="true"]{color:var(--accent-fg);background:var(--accent)}

/* ---------- shared bits ---------- */
.pill{display:inline-block;font:700 11px var(--f-mono);padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.confirmed{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pill.booked{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.pending{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.pill.cancel{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.pill.idea{border-style:dashed;color:var(--fg)}
.flag{margin:8px 0;padding:8px 11px;border-radius:8px;background:var(--warn-soft);border-left:3px solid var(--warn);font-size:14.5px}
.flag.soft{background:var(--gold-soft);border-left-color:var(--gold)}
.lbl{font:700 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
.time{font:700 14px var(--f-mono)}
.empty{color:var(--muted);padding:24px 4px;text-align:center}
textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-size:16px;line-height:1.4;resize:none;display:block;min-height:44px;overflow:hidden}
textarea::placeholder,input::placeholder{color:var(--muted)}
.more{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.more summary{padding:11px 12px;font-weight:700;font-size:14.5px;cursor:pointer;min-height:44px}
.more .in{padding:0 12px 12px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.more .in h4{margin:12px 0 2px;font:700 11.5px var(--f-mono);color:var(--muted);white-space:normal}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 13px;font-weight:700;font-size:14px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.small{min-height:36px;padding:5px 10px;font-size:13px}

/* ---------- next ---------- */
.count{font:700 14px var(--f-mono);color:var(--now);letter-spacing:.03em}
.count.done{color:var(--muted)}
.where{font:700 32px/1.08 var(--f-display);margin:4px 0 6px;overflow-wrap:anywhere}
.what{font-size:18px;font-weight:700;line-height:1.25}
.subw{color:var(--muted);margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.say{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:11px 13px;font-size:17px;line-height:1.35}
.walk{background:var(--surface);border-radius:8px;padding:11px 13px;border:1px solid var(--line)}
.qs{display:grid;gap:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px 10px 8px;display:grid;grid-template-columns:44px 1fr;gap:0 4px}
.q .tick{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.q .tick i{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.q.done .tick i{background:var(--ok);border-color:var(--ok)}
.q.done .tick i::after{content:"";width:9px;height:5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:translateY(-1px) rotate(-45deg)}
.q .qt{font-size:16.5px;line-height:1.32;padding-top:9px;background:none;border:0;text-align:left;padding-inline:0;padding-bottom:0}
.q.done .qt{color:var(--muted)}
.q .h{grid-column:2;color:var(--muted);font-size:13.5px;margin-top:5px;white-space:pre-wrap}
.q .a{grid-column:2;margin-top:8px}
.ul{margin:0;padding:0 0 0 18px}
.ul li{margin:5px 0}
.dont{padding:10px 12px;border-radius:8px;background:var(--warn-soft);font-size:15px}
.then{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:6px;min-height:52px}
.then small{display:block;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- day ---------- */
.row{border:1px solid var(--line);background:var(--surface);border-radius:10px;margin-bottom:6px;scroll-margin:190px 0 90px}
.row>button.head{width:100%;background:none;border:0;text-align:left;display:grid;grid-template-columns:56px 1fr;gap:10px;padding:11px 12px;min-height:56px}
.row .t{font:700 14px/1.25 var(--f-mono)}
.row .t small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.row .tt{font-weight:700;line-height:1.25}
.row .rm{color:var(--muted);font-size:14px;margin-top:2px}
.row .p{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.row.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.row.past{opacity:.6}.row.on.past{opacity:1}
.row.skip{opacity:.5}
.row.cancel .tt{text-decoration:line-through}
.row.idea{border-style:dashed;background:transparent}
.row .x{padding:0 12px 12px 12px;font-size:15px}
.row .x .lbl{margin-top:8px}
.brk{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;margin:0 0 7px;padding:7px 12px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:14px}
.brk .bt{font:700 12.5px var(--f-mono);line-height:1.25}.brk .bt small{display:block;font-weight:400;opacity:.8}
.brk.real{border:1px solid var(--ok);background:var(--ok-soft);color:var(--fg);font-size:15.5px;padding:10px 12px}.brk.real b{color:var(--ok)}
.brk.past{opacity:.55}
.brksum{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.brksum .lbl{margin:0 0 6px}.brksum .chips{display:flex;flex-wrap:wrap;gap:6px}
.brksum .chip{font:700 12.5px var(--f-mono);padding:3px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.brksum .flag{margin:8px 0 0}.brksum small{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.nextbrk{margin:8px 0 0;padding:7px 10px;border-radius:8px;background:var(--ok-soft);color:var(--fg);font-size:14.5px}.nextbrk b{color:var(--ok)}.nextbrk.none{background:var(--warn-soft)}.nextbrk.none b{color:var(--warn)}
.blk.brkchip{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}.blk.brkchip .bl{color:var(--ok)}
.blk.brkstop:not([aria-pressed="true"]){border-color:var(--ok);background:var(--ok-soft)}
.pill.brkp{background:var(--ok-soft);color:var(--ok)}
.dl-in>span.dl-br{top:50%;height:8px;margin-top:-4px;border-radius:2px;background:var(--ok);opacity:.55}
.gapnote{margin:-1px 0 7px 12px;font-size:13.5px;color:var(--gold)}
.gapnote.bad{color:var(--warn)}
.section-h{font:700 18px var(--f-display);margin:26px 0 8px}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-height:44px;font-size:16px;margin-bottom:8px}
.prog{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:9px 0}
.prog button.pt{background:none;border:0;text-align:left;padding:0;min-height:40px}
.prog .pt b{display:block;font-size:15px;line-height:1.25}
.prog .pt small{color:var(--muted);font-size:13px}

/* ---------- map ---------- */
.plan-photo{display:block;width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;padding:0;background:none;overflow:hidden}
.plan-photo img{display:block;width:100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;min-height:88px;display:flex;flex-direction:column;gap:6px}
.tile.wide{grid-column:1/-1}
.tile b{font:700 15.5px var(--f-display)}
.tile.on{border-color:var(--accent);background:var(--accent-soft)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{font:700 11.5px var(--f-mono);background:var(--surface-2);padding:2px 7px;border-radius:999px}
.dot.on{background:var(--accent);color:var(--accent-fg)}
.dot.pk{outline:1px solid var(--gold)}

/* ---------- notes ---------- */
.sync{font:500 12.5px var(--f-mono);color:var(--muted);display:flex;gap:7px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--ok)}.sync.busy i{background:var(--gold)}.sync.off i{background:var(--warn)}
.ngroup{border-top:1px solid var(--line);padding:12px 0;scroll-margin:190px 0 90px}
.ngroup.on>h3{color:var(--accent)}
.ngroup h3{font-size:16px;margin-bottom:6px}
.ngroup h3 button{all:unset;cursor:pointer;display:block;padding:8px 0;min-height:36px;box-sizing:border-box}
.ngroup .ans{font-size:14.5px;margin:6px 0;padding-left:10px;border-left:2px solid var(--line)}
.ngroup .ans b{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.claude{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
.answer{white-space:pre-wrap;margin-top:10px;font-size:15.5px}

/* ---------- AI: copy, paste back ---------- */
.step{font-weight:700}
.sheet p{margin:8px 0}
.aifound{font-size:14.5px;margin-top:10px}
.aifound ul{margin:6px 0 0;padding-left:18px;max-height:30vh;overflow:auto}
.aifound li{margin:4px 0}
.aifound .bad{color:var(--warn)}
.okline{color:var(--ok);font-weight:700}
.fmt{font:500 12.5px/1.45 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}

/* ---------- sheet + zoom ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:16px 16px 0 0;max-height:78vh;overflow:auto;
  padding:16px var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--gl);border-top:1px solid var(--line)}
.sheet h2{font-size:20px;margin-bottom:6px}
.sheet .close{float:right}
.pick{width:100%;display:grid;grid-template-columns:auto 1fr;gap:10px;text-align:left;background:var(--surface-2);border:0;border-radius:8px;padding:11px;margin-top:6px;min-height:48px}
.zoom{position:fixed;inset:0;z-index:50;background:#000;overflow:auto;touch-action:auto}
.zoom img{display:block;width:240%;max-width:none}
.zoom button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px}
.zoom .ghost{color:#fff;background:#222;border-color:#555}
@media (max-width:370px){.seg button{padding-inline:8px}.ghost{padding-inline:9px}.clock{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<header class="bar" id="bar">
  <div class="row1">
    <div class="seg" id="seg" role="group" aria-label="Day">
      <button data-day="thu">Thu 5</button><button data-day="fri">Fri 6</button>
    </div>
    <div class="clock" id="clock"></div>
    <button class="ghost" id="nowBtn">Now</button>
    <button class="ghost" id="aiBtn" aria-haspopup="dialog">AI</button>
    <button class="ghost icon" id="themeBtn" aria-label="Switch theme"></button>
  </div>
  <div class="blocks" id="strip"></div>
  <div class="dayline" id="dayline" role="slider" tabindex="0" aria-label="Move through the day"><div class="dl-in" id="dl-in"></div></div>
  <div class="hours" id="hours"></div>
</header>
<div class="banner" id="banner" hidden></div>
<main id="main"></main>
<nav class="tabs" id="tabs" aria-label="Views">
  <button data-tab="next">Next</button><button data-tab="day">Day</button><button data-tab="map">Map</button><button data-tab="notes">Notes</button>
</nav>
<div id="overlay"></div>

<script id="programme" type="application/json">/*PROGRAMME*/</script>
<script>
"use strict";
/* ============ small helpers ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich = s => esc(s).replace(/https?:\/\/[^\s<)]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const hhmm = m => m == null ? "" : String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const hash = s => { let h = 5381; for (const c of String(s)) h = (h * 33 + c.codePointAt(0)) >>> 0; return "q" + h.toString(36); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
const DATE = { thu: "2026-11-05", fri: "2026-11-06" };
const DAY0 = Date.UTC(2026, 10, 5);
const AREAS = [
  ["portal", "Portal Stage"], ["relic", "Relic Stage"], ["cage", "Cage Stage"], ["intra", "Intraprenör"],
  ["mtm", "Meet To Match Area"], ["mentor", "Mentor Ground"], ["reg", "Registration"],
  ["keller", "Keller"], ["galerie", "Galerie"], ["", "Other places"]
];
const ST = {
  confirmed: ["Confirmed", "confirmed"], booked: ["Booked", "booked"], pending: ["Waiting", "pending"],
  planned: ["Plan", ""], "not booked": ["Not booked", "pending"], check: ["Check", "pending"], "to cancel": ["To cancel", "cancel"], proposed: ["Idea · not booked", "idea"], pick: ["My pick", ""]
};
const PROGRAMME = (() => { try { return JSON.parse($("programme").textContent); } catch { return []; } })();

/* ============ state ============ */
let pack = window.GG_PACK || store.get("gg.pack", null);
let notes = store.get("gg.notes", {});
let dayState = store.get("gg.state", { added: [], skipped: [], t: 0 });
let plan = store.get("gg.plan", null);
let mine = store.get("gg.mine", { stops: {}, t: 0 });   // what you added or changed yourself, kept apart from the plan
const dirty = new Set(store.get("gg.dirty", []));
const ui = { day: null, tab: store.get("gg.tab", "next"), sel: null, manualAt: 0, progOpen: false, progQ: "", sheet: null };
let db = null, col = null, sample = null, syncState = "local", serverSeen = false, pendingRender = false;

/* time: ?now=thu-1155 lets you test any moment */
function berlinNow() {
  const q = new URLSearchParams(location.search).get("now");

function aiParse(txt) {
  const blocks = []; const problems = [];
  let cur = null, lastKey = null, lastQ = null;
  const begin = stop => { cur = { stop, f: {}, qs: [], listen: [], more: [], qsMode: "" }; blocks.push(cur); lastKey = lastQ = null; };
  for (const line of aiLines(txt)) {
    if (!line) { lastKey = null; continue; }
    if (/^`+/.test(line) || /^GG-(START|END)/i.test(line)) continue;
    const m = line.match(/^([A-Za-z']{1,10})\s*:\s*(.*)$/);
    const key = m && AI_KEYS[m[1].toUpperCase()];
    if (!key) {
      if (lastKey && cur) {                       // the AI wrapped a long line
        if (lastKey === "q") lastQ.t += " " + line;
        else if (lastKey === "h" && lastQ) lastQ.h += " " + line;
        else if (lastKey === "listen") cur.listen[cur.listen.length - 1] += " " + line;
        else if (cur.f[lastKey]) cur.f[lastKey] += " " + line;
      }
      continue;
    }
    const v = m[2].trim();
    if (key === "stop") { begin(v); continue; }
    if (!cur) begin("");                          // questions with no STOP go on the stop you're looking at
    if (key === "q") { if (!v) continue; lastQ = { t: v }; cur.qs.push(lastQ); lastKey = "q"; }
    else if (key === "h") { if (lastQ && v) { lastQ.h = v; lastKey = "h"; } }
    else if (key === "listen") { if (v) { cur.listen.push(v); lastKey = "listen"; } }
    else if (key === "more") { const i = v.indexOf(" :: "); if (i > 0) cur.more.push({ h: v.slice(0, i), t: unline(v.slice(i + 4)) }); lastKey = null; }
    else if (key === "reset") { cur.reset = true; lastKey = null; }
    else if (key === "remove") { cur.remove = true; lastKey = null; }
    else if (key === "qmode") { if (/replace|rewrite/i.test(v)) cur.qsMode = "replace"; lastKey = null; }
    else { if (v) { cur.f[key] = unline(v); lastKey = key; } }
  }
  const ops = [];
  for (const b of blocks) {
    const code = b.stop.replace(/^#\s*/, "").trim(), low = code.toLowerCase();
    if (b.remove) { const gone = code && byId(low); if (gone && low.startsWith("m:")) ops.push({ id: gone.id, kind: "remove", prog: null, fields: {}, qs: [] }); continue; }
    const fields = {};
    for (const k of ["title", "short", "who", "room", "say", "walk", "dont", "verdict", "note", "practical", "whoText", "qlead", "reason", "need"]) if (b.f[k]) fields[k] = b.f[k];
    if (b.f.kind && KINDS.includes(b.f.kind.toLowerCase())) fields.kind = b.f.kind.toLowerCase();
    if (b.f.prog && PROGRAMME.some(p => p.id === b.f.prog.toLowerCase())) fields.prog = b.f.prog.toLowerCase();
    if (b.more.length) fields.extra = b.more;
    if (b.f.room) fields.area = guessArea(b.f.room);
    if (b.f.status && STATUS_IN[b.f.status.toLowerCase()]) { fields.status = STATUS_IN[b.f.status.toLowerCase()]; fields.idea = fields.status === "proposed"; }
    if (b.listen.length) fields.listen = b.listen;
    const day = b.f.day ? parseDay(b.f.day) : null, time = b.f.time ? parseTime(b.f.time) : null;
    if (b.f.day && !day) problems.push(`${code || b.f.title || "Stop"}: "${b.f.day}" isn't Thu or Fri.`);
    if (b.f.time && !time) problems.push(`${code || b.f.title || "Stop"}: couldn't read the time "${b.f.time}".`);
    let id = null, kind = "update", prog = null;
    const known = code && byId(low);
    if (!code && !b.stop) { id = ui.sel; if (!id) { problems.push("Some questions have no STOP line and no stop is selected."); continue; } }
    else if (known) id = known.id;
    else if (/^p\d+$/i.test(low) && PROGRAMME.some(p => p.id === low)) {
      const linked = allStops().find(s => s.prog === low);
      if (linked) id = linked.id; else { id = "p:" + low; kind = "add"; prog = low; }
    } else if (low.startsWith("m:")) {                // your own stop with a fixed code: pasting it again updates it, even if the title changed
      if (!b.f.title) { problems.push(`#${code}: a new stop needs a TITLE, so I left it out.`); continue; }
      id = low; kind = "new";
    } else if (low === "new" || b.f.title) {
      if (!b.f.title) { problems.push("A new stop has no TITLE, so I left it out."); continue; }
      id = "m:" + (day || "any") + "-" + slug(b.f.title);
      kind = byId(id) ? "update" : "new";
    } else { problems.push(`#${code}: no stop or talk has this code, so I left it out.`); continue; }
    if (day && !time && kind !== "new") { const cur0 = byId(id); if (cur0 && cur0.s != null) { fields.day = day; fields.s = cur0.s; fields.e = cur0.e; fields.hall = false; } }
    if (time) { const cur0 = byId(id); const dd = day || (cur0 && cur0.day !== "any" && cur0.day) || null;
      if (dd) { fields.day = dd; fields.s = time.s; fields.e = time.e; fields.hall = false; } else problems.push(`${b.f.title || code}: has a time but no day, so it goes under "No set time".`); }
    if ((kind === "new" || b.reset) && fields.s == null) { fields.hall = true; fields.day = "any"; fields.s = null; fields.e = null; }
    if (kind === "new" && !fields.short) fields.short = b.f.title.slice(0, 18);
    if (!Object.keys(fields).length && !b.qs.length) { problems.push(`${code}: nothing to add under this STOP.`); continue; }
    ops.push({ id, kind, prog, fields, qs: b.qs, qsMode: b.qsMode, reset: !!b.reset });
  }
  return { ops, problems };
}
function opLabel(op) {
  const cur = byId(op.id), p = op.prog && PROGRAMME.find(x => x.id === op.prog);
  const name = op.fields.title || (cur && (cur.short || cur.title)) || (p && p.title) || op.id;
  const have = new Set(((cur && cur.qs) || []).map(q => qKey(q.t)));
  const nq = op.qs.filter(q => !have.has(qKey(q.t))).length;
  const bits = [];
  if (op.kind === "remove") return { name, text: "removed from your plan" };
  if (op.kind === "new") bits.push("new stop");
  if (op.kind === "add") bits.push("added to your day");
  if (nq) bits.push(op.qsMode === "replace" ? `${nq} new, old questions replaced` : `${nq} new question${nq > 1 ? "s" : ""}`);
  else if (op.qsMode === "replace") bits.push("questions replaced");
  const other = Object.keys(op.fields).filter(k => !["short", "area", "hall"].includes(k));
  if (other.length && op.kind === "update") bits.push(other.length === 1 ? "1 field updated" : `${other.length} fields updated`);
  return { name, text: bits.join(", ") || "no change" };
}
function aiShow() {
  const f = $("aifound"), btn = $("aigo"); if (!f) return;
  const txt = ui.aiDraft || "";
  if (!txt.trim()) { f.innerHTML = ""; btn.disabled = true; return; }
  const { ops, problems } = aiParse(txt);
  btn.disabled = !ops.length;
  btn.textContent = ops.length ? `Add to my app (${ops.length})` : "Add to my app";
  f.innerHTML = (ops.length ? `<b>Found:</b><ul>${ops.map(o => { const l = opLabel(o); return `<li><b>${esc(l.name)}:</b> ${esc(l.text)}</li>`; }).join("")}</ul>`
    : `<p>Nothing I can use yet. Paste the AI's whole answer, or the part from GG-START to GG-END.</p>`)
    + (problems.length ? `<ul class="bad">${problems.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "");
}
function sheetAI(msg) {
  const undo = store.get("gg.undo", null);
  openSheet(`<h2>Fill it with your AI</h2><p class="subw" style="font-size:13px;margin:0">App version 7</p>
    <p><span class="step">1.</span> Tap Copy and paste it into your AI (Claude, ChatGPT, Gemini…). Right after it, type the talks and meetings you have and what you want from them. It gets your plan, your questions and the whole programme, not your notes.</p>
    <button class="btn primary" id="aicopy">Copy</button> <span class="subw" id="aicopied" style="font-size:14px"></span>
    <p style="margin-top:16px"><span class="step">2.</span> Copy the AI's answer and paste it here. New questions are added to your stops. Your answers and notes stay.</p>
    <textarea id="aiin" rows="3" placeholder="Paste the AI's answer" aria-label="AI answer">${esc(ui.aiDraft || "")}</textarea>
    <div class="aifound" id="aifound"></div>
    <div class="actions"><button class="btn primary" id="aigo" disabled>Add to my app</button><label class="btn" style="position:relative;display:inline-flex;align-items:center;cursor:pointer"><input type="file" id="aifile" accept=".txt,text/plain" style="position:absolute;inset:0;opacity:0;width:100%;height:100%" aria-label="Pick a text file">Pick a text file</label>${undo ? `<button class="btn" id="aiundo">Undo last paste</button>` : ""}</div>
    ${msg ? `<p class="okline">${esc(msg)}</p>` : ""}
    <details class="more"><summary>The format, if you write it by hand</summary><div class="in"><pre class="fmt">${esc(FORMAT)}</pre></div></details>
    <details class="more"><summary>Clear everything</summary><div class="in"><p>This erases your pasted questions, answers, ticks and notes from this phone. Copy your notes first, on the Notes tab. There is no undo.</p><button class="btn" id="aiwipe">Erase everything</button></div></details>`);
  aiShow();
  const t = $("aiin"); if (t) { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight + 2, 220) + "px"; }
}
function aiCopy() {
  const m = $("aicopied"), txt = aiPrompt();
  copyText(txt).then(() => { m.textContent = "Copied. Now paste it into your AI."; }, () => {
    m.textContent = "Couldn't copy. Select all of this and copy it:";
    const ta = document.createElement("textarea");
    ta.readOnly = true; ta.value = txt; ta.style.cssText = "height:120px;overflow:auto;margin-top:8px";
    m.after(ta); ta.focus(); ta.select();
  });
}
function aiApply() {
  const { ops } = aiParse(ui.aiDraft || ""); if (!ops.length) return;
  store.set("gg.undo", { mine, added: dayState.added });
  mine = JSON.parse(JSON.stringify(mine));
  let qCount = 0;
  for (const op of ops) {
    const cur = byId(op.id), ov = mine.stops[op.id] || {};
    if (op.kind === "remove") {
      const n = noteOf(op.id);
      if (n.text || Object.keys(n.answers || {}).length) mine.stops[op.id] = { ...ov, dropped: true };  // your notes stay in the copy buttons
      else delete mine.stops[op.id];
      continue;
    }
    const next = { ...(op.reset ? {} : ov), ...op.fields, dropped: false };
    if (op.qsMode === "replace") {
      const ans = noteOf(op.id).answers || {};
      const kept = ((cur && cur.qs) || []).filter(q => { const a = ans[hash(q.t)]; return a && (a.done || a.a); });  // answered questions never vanish
      for (const k of kept) {  // same question, reworded punctuation: the answer follows it. The old entry stays, so undo still finds it
        const nq = op.qs.find(q => qKey(q.t) === qKey(k.t)), a = ans[hash(k.t)];
        if (nq && hash(nq.t) !== hash(k.t) && !ans[hash(nq.t)]) changeNote(op.id, n => { n.answers[hash(nq.t)] = { ...a, q: nq.t }; });
      }
      next.qs = mergeQs(op.qs, kept.filter(k => !op.qs.some(q => qKey(q.t) === qKey(k.t)))); next.qsMode = "replace";  // the new order and hints win; old answered ones go last
    } else if (op.qs.length) next.qs = mergeQs(ov.qs, op.qs);
    qCount += op.qs.length;
    mine.stops[op.id] = next;
    if (op.kind === "add") { const s = new Set(dayState.added); s.add(op.id); dayState.added = [...s]; }
  }
  mine.t = Date.now(); store.set("gg.mine", mine); markDirty("mine");
  if (ops.some(o => o.kind === "add")) { dayState.t = Date.now(); store.set("gg.state", dayState); markDirty("state"); }
  fresh();
  ui.aiDraft = "";
  if (!selected()) { const c = currentStop(ui.day); ui.sel = c ? c.id : null; }
  paint();
  const nStops = ops.filter(o => o.kind !== "remove").length;
  sheetAI(`Done. ${nStops} stop${nStops === 1 ? "" : "s"}, ${qCount} question${qCount === 1 ? "" : "s"}.`);
}
function aiUndo() {
  const u = store.get("gg.undo", null); if (!u) return;
  mine = { stops: u.mine.stops || {}, t: Date.now() }; store.set("gg.mine", mine); markDirty("mine");
  dayState.added = u.added || []; dayState.t = Date.now(); store.set("gg.state", dayState); markDirty("state");
  store.set("gg.undo", null); fresh();
  if (!selected()) { const c = currentStop(ui.day); ui.sel = c ? c.id : null; }
  paint(); sheetAI("Last paste undone.");
}
/* ============ floor plan photo ============ */
async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    for (const [w, qual] of [[1400, .72], [1200, .66], [1000, .6], [800, .55], [640, .5]]) {
      const c = document.createElement("canvas"), k = Math.min(1, w / img.naturalWidth);
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL("image/jpeg", qual);
      if (data.length < 200000) return data;
    }
  } finally { URL.revokeObjectURL(url); }
  return null;
}
async function addPlan(file) {
  try {
    const data = await shrinkPhoto(file);
    if (!data) return;
    plan = { data, t: Date.now() };
    store.set("gg.plan", plan); markDirty("plan_photo"); paint();
  } catch { /* an unreadable photo: nothing changes */ }
}
/* ============ events ============ */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-close],[data-tab]"); if (!t) return;
  const d = t.dataset;
  if ("close" in d) { closeSheet(); return; }
  if (d.day) { ui.day = d.day; const c = currentStop(d.day); ui.sel = c ? c.id : null; ui.manualAt = Date.now(); paint(); reveal(); return; }
  if (d.tab) { setTab(d.tab); return; }
  if (d.sel) {
    const toggleOff = ui.tab === "day" && ui.sel === d.sel && t.classList.contains("head");
    select(d.sel, { stay: ui.tab === "day" && t.classList.contains("head") });
    if (t.classList.contains("then")) window.scrollTo(0, 0);
    if (toggleOff) return;
    return;
  }
  if (d.open) { closeSheet(); ui.tab = "next"; store.set("gg.tab", "next"); select(d.open); return; }
  if (d.area !== undefined) { sheetArea(d.area); return; }
  if (d.about) { sheetAbout(d.about); return; }
  if (d.tick) { const [id, k] = d.tick.split("|"); const s = byId(id); const q = s && (s.qs || []).find(x => hash(x.t) === k);
    changeNote(id, n => { const a = n.answers[k] || { q: q ? q.t : "", a: "", done: false }; a.done = !a.done; n.answers[k] = a; }); paintMain(); return; }
  if (d.qopen) { const key = "open_" + d.qopen.replace("|", ""); ui[key] = !ui[key]; paintMain(); return; }
  if (d.add) { setStateList("added", d.add, true); setStateList("skipped", d.add, false); if (!selected()) { const c = currentStop(ui.day); ui.sel = c ? c.id : null; } paint(); return; }
  if (d.remove) { setStateList("added", d.remove, false); if (ui.sel === d.remove) { const c = currentStop(ui.day); ui.sel = c ? c.id : null; } paint(); return; }
  if (d.skip) { setStateList("skipped", d.skip, true); paint(); return; }
  if (d.unskip) { setStateList("skipped", d.unskip, false); paint(); return; }
  if ("zoom" in d) { $("overlay").innerHTML = `<div class="zoom"><img alt="Floor plan" src="${esc(plan.data)}"><button class="ghost" data-close>Close</button></div>`; return; }
  if ("planoff" in d) { plan = null; store.set("gg.plan", null); plan = null; dirty.add("plan_photo"); markDirty("plan_photo"); paint(); return; }
  if (t.id === "nowBtn") { ui.manualAt = 0; followNow(); paint(); reveal(); return; }
  if (t.id === "themeBtn") { setTheme(curTheme() === "light" ? "dark" : "light"); return; }
  if (t.id === "copyqs") { const m = $("copied"); copyText(everythingText()).then(() => m.textContent = "Copied", () => m.textContent = "Copy failed. Select text in Notes instead."); return; }
  if (t.id === "copyall") { const m = $("copied"); copyText(allNotesText()).then(() => m.textContent = "Copied", () => m.textContent = "Copy failed. Select text in Notes instead."); return; }
  if (t.id === "aiBtn" || "ai" in d) { sheetAI(); return; }

  if (t.id === "aiundo") { aiUndo(); return; }
  if (t.id === "aiwipe") {
    if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "Tap again to erase it all"; return; }
    for (const k of ["gg.pack", "gg.notes", "gg.state", "gg.plan", "gg.mine", "gg.undo", "gg.dirty", "gg.tab"]) { try { localStorage.removeItem(k); } catch {} }
    location.reload(); return;
  }
  if (t.id === "askgo") { ask(); return; }
});

/* the notch timeline: tap or drag */
function dayAt(e) {
  const r = $("dl-in").getBoundingClientRect(), list = stopsOn(ui.day); if (!list.length) return;
  const x = e.clientX - r.left;
  let best = null, bd = 1e9;
  for (const s of list) {
    const px = (s.s - span.a) / (span.b - span.a) * r.width, d = Math.abs(px - x);
    if (d < bd - .01) { best = s; bd = d; }
  }
  if (best && best.id !== ui.sel) select(best.id);
}
const dl = $("dayline");
dl.addEventListener("pointerdown", e => { try { dl.setPointerCapture(e.pointerId); } catch {} dayAt(e); e.preventDefault(); });
dl.addEventListener("pointermove", e => { if (dl.hasPointerCapture && dl.hasPointerCapture(e.pointerId)) dayAt(e); });
dl.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const list = stopsOn(ui.day), i = list.findIndex(s => s.id === ui.sel);
  const nx = list[Math.max(0, Math.min(list.length - 1, i + (e.key === "ArrowRight" ? 1 : -1)))];
  if (nx) select(nx.id); e.preventDefault();
});

/* clock: every 20 s. Follows the day unless you moved in the last 5 minutes. */
function tick() {
  const typing = document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName);
  if (Date.now() - ui.manualAt > 300000 && todayKey() && !typing && !ui.sheet) {
    const before = ui.sel, dayBefore = ui.day;
    followNow();
    if (before !== ui.sel || dayBefore !== ui.day) { paint(); if (ui.tab === "next") window.scrollTo(0, 0); return; }
  }

  const c = $("countEl"), s = selected();
  if (c && s) { const v = countdown(s); c.textContent = v.t; c.className = "count" + (v.done ? " done" : ""); }
}

setTheme(store.get("gg.theme", "dark"));
followNow();
paint();
setInterval(tick, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); scheduleFlush(100); } });
connect();
